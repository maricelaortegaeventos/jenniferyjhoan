<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0.035"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" fill="#fbfaf4"/>
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.7"/>
</svg>